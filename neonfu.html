<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon-fu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a001f;
            color: #00ffff;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a0033 0%, #0a001f 70%);
        }
        
        canvas {
            border: 4px solid #ff00ff;
            box-shadow: 
                0 0 30px #ff00ff,
                0 0 60px #00ffff;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #title {
            font-size: 48px;
            text-shadow: 
                0 0 20px #ff00ff,
                0 0 40px #00ffff;
            margin-bottom: 20px;
            animation: neon-flicker 1.5s infinite alternate;
        }
        
        @keyframes neon-flicker {
            0% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff; }
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 15px #ffff00;
            z-index: 20;
            pointer-events: none;
        }
        
                #mobile-controls {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

       .dir-btn {
            width: 78px;
            height: 78px;
            font-size: 44px;
            background: rgba(0, 255, 255, 0.25);
            border: 5px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 25px #00ffff;
        }
        
        .dir-btn {
            background: rgba(0, 255, 255, 0.2);
            border: 4px solid #00ffff;
            color: #00ffff;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 0 20px #00ffff;
            text-shadow: 0 0 10px #00ffff;
            user-select: none;
        }
        
        .fire-btn {
            grid-column: span 3;
            background: rgba(255, 0, 255, 0.3);
            border: 4px solid #ff00ff;
            color: #ff00ff;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 0 25px #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }
        
        #game-over-screen, #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 0, 31, 0.95);
            border: 6px solid #ff00ff;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 
                0 0 40px #ff00ff,
                0 0 80px #00ffff;
            pointer-events: auto;
            display: none;
            flex-direction: column;
            align-items: center;
            min-width: 380px;
        }
        
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 22px;
            background: #000;
            color: #ffff00;
            border: 4px solid #ffff00;
            cursor: pointer;
            box-shadow: 0 0 20px #ffff00;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #ffff00;
            color: #000;
            box-shadow: 0 0 40px #ffff00;
        }
        
        .slogan {
            font-size: 28px;
            color: #ff00ff;
            margin: 15px 0;
            text-shadow: 0 0 20px #ff00ff;
        }
        #game-over-screen {
            z-index: 50;           /* Make sure it's on top */
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        
        <!-- Score -->
        <div id="score">SCORE: <span id="score-value">000</span></div>
        
                <!-- Mobile controls - Arrows only -->
        <div id="mobile-controls">
            <!-- Arrow Keys - Bottom Right -->
            <div id="arrows" style="position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: center;">
                
                <!-- Up Arrow -->
                <button class="dir-btn" id="btn-up" style="margin-bottom: 8px;">↑</button>
                
                <!-- Middle Row -->
                <div style="display: flex; gap: 8px;">
                    <button class="dir-btn" id="btn-left">←</button>
                    <button class="dir-btn" id="btn-down">↓</button>
                    <button class="dir-btn" id="btn-right">→</button>
                </div>
            </div>
        </div>
        
        <!-- Overlays -->
        <div id="ui-overlay">
            <!-- Start screen -->
            <div id="start-screen">
                <h1 id="title">NEON-FU</h1>
                <p style="color:#ffff00; margin:10px 0 30px; font-size:18px;">4 DIRECTIONS • 4 SECOND • PURE REFLEX</p>
                <p style="color:#00ffff; max-width:320px; line-height:1.4; margin-bottom:30px;">
                    Enemies appear from 4 directions.<br>
                    Aim with arrows / touch.<br>
                    Press FIRE (F) before they shoot!<br><br>
                    <span style="color:#ff00ff">Desktop: ↑↓←→ + F</span><br>
                    <span style="color:#ff00ff">Mobile: Touch pads + FIRE</span>
                </p>
                <button onclick="startGame()">START GAME</button>
                <p style="font-size:12px; margin-top:30px; opacity:0.6;">Made as a single HTML file • Works offline</p>
            </div>
            
            <!-- Game Over screen -->
            <div id="game-over-screen">
                <h1 style="color:#ff0000; text-shadow:0 0 30px #ff0000; margin:0;">GAME OVER</h1>
                <div id="death-slogan" class="slogan"></div>
                <div style="font-size:22px; margin:15px 0; color:#ffff00;">
                    FINAL SCORE: <span id="final-score" style="color:#00ffff"></span>
                </div>
                <button onclick="restartGame()">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        // =============== NEON-FU GAME ===============
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let audioCtx;
        let gameState = 'start'; // start, playing, over
        let score = 0;
let baseWaitTime = 6000;   // Starting wait time = 6 seconds
        let currentAim = null;
        let currentEnemy = null;
        let lastTime = 0;
        let playerX = 400;
        let playerY = 300;
        
        // Random death slogans
        const deathSlogans = [
            "SPECTACLES SHATTERED!",
            "HAT'S OFF... FOREVER!",
            "NEON DOWN, BABY!",
            "GHOSTED BY A GHOST!",
            "LIGHTS OUT, FIGHTER!",
            "BLUE HAT MEETS BULLET!",
            "REFLEXES FAILED!",
            "YOU GOT NEON'D!"
        ];
        
        // Audio functions (procedural sounds - no external files needed)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playGunshot(isPlayer) {
            initAudio();
            const duration = 0.25;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(isPlayer ? 1200 : 800, audioCtx.currentTime);
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(isPlayer ? 0.9 : 0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            noise.connect(filter).connect(gain).connect(audioCtx.destination);
            noise.start();
            
            // Extra kick for gunshot feel
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(isPlayer ? 180 : 140, audioCtx.currentTime);
            const oscGain = audioCtx.createGain();
            oscGain.gain.value = 0.4;
            oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(oscGain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        
        function playEnemyShout() {
            initAudio();
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(720, audioCtx.currentTime);
            
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
            
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.9);
            
            // Second tone for ghost wail
            setTimeout(() => {
                if (gameState !== 'playing') return;
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(420, audioCtx.currentTime);
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc2.connect(gain2).connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.4);
            }, 120);
        }
        
        function playPlayerDeath() {
            initAudio();
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }
        
        // Draw player (you) - black spectacles + blue hat
        function drawPlayer() {
            // Glow
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00ffff';
            
            // Body (neon cyan jacket)
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(playerX - 28, playerY - 8, 56, 58);
            
            // Head
            ctx.fillStyle = '#ffddaa';
            ctx.beginPath();
            ctx.arc(playerX, playerY - 38, 26, 0, Math.PI * 2);
            ctx.fill();
            
            // Blue hat
            ctx.fillStyle = '#0044ff';
            ctx.shadowColor = '#00aaff';
            ctx.fillRect(playerX - 32, playerY - 68, 64, 14);
            // Hat top
            ctx.beginPath();
            ctx.moveTo(playerX - 22, playerY - 68);
            ctx.lineTo(playerX, playerY - 88);
            ctx.lineTo(playerX + 22, playerY - 68);
            ctx.fill();
            
            // Black spectacles
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 6;
            // Left lens
            ctx.beginPath();
            ctx.ellipse(playerX - 11, playerY - 38, 11, 9, 0, 0, Math.PI * 2);
            ctx.stroke();
            // Right lens
            ctx.beginPath();
            ctx.ellipse(playerX + 11, playerY - 38, 11, 9, 0, 0, Math.PI * 2);
            ctx.stroke();
            // Bridge
            ctx.beginPath();
            ctx.moveTo(playerX - 11, playerY - 38);
            ctx.lineTo(playerX + 11, playerY - 38);
            ctx.stroke();
            
            // Eyes inside glasses
            ctx.fillStyle = '#111111';
            ctx.fillRect(playerX - 15, playerY - 41, 8, 4);
            ctx.fillRect(playerX + 7, playerY - 41, 8, 4);
            
            // Reset shadow
            ctx.shadowBlur = 0;
            
            // Two hands (simple arms)
            ctx.strokeStyle = '#ffddaa';
            ctx.lineWidth = 12;
            // Left arm
            ctx.beginPath();
            ctx.moveTo(playerX - 25, playerY + 10);
            ctx.quadraticCurveTo(playerX - 55, playerY + 25, playerX - 68, playerY + 8);
            ctx.stroke();
            // Right arm
            ctx.beginPath();
            ctx.moveTo(playerX + 25, playerY + 10);
            ctx.quadraticCurveTo(playerX + 55, playerY + 25, playerX + 68, playerY + 8);
            ctx.stroke();
        }
        
        // Draw aim indicator (neon arrows around player)
        function drawAimIndicator() {
            ctx.shadowBlur = 30;
            const dirs = {
                up: {x: playerX, y: playerY - 95, text: '↑'},
                down: {x: playerX, y: playerY + 95, text: '↓'},
                left: {x: playerX - 95, y: playerY, text: '←'},
                right: {x: playerX + 95, y: playerY, text: '→'}
            };
            
            Object.keys(dirs).forEach(key => {
                const pos = dirs[key];
                const isActive = currentAim === key;
                
                ctx.shadowColor = isActive ? '#ffff00' : '#00ffff';
                ctx.fillStyle = isActive ? '#ffff00' : '#00ffff';
                
                ctx.font = isActive ? 'bold 48px Arial' : 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pos.text, pos.x, pos.y);
            });
            
            ctx.shadowBlur = 0;
        }
        
        // Draw ghost enemy
        function drawEnemy(enemy) {
            const ex = enemy.x;
            const ey = enemy.y;
            
            // Ghost glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#00ff88';
            
            // Ghost body
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(ex, ey - 8, 28, Math.PI, 0, false); // head
            ctx.lineTo(ex + 28, ey + 32);
            // Wavy bottom
            ctx.quadraticCurveTo(ex + 18, ey + 48, ex + 8, ey + 32);
            ctx.quadraticCurveTo(ex - 8, ey + 48, ex - 18, ey + 32);
            ctx.quadraticCurveTo(ex - 28, ey + 48, ex - 28, ey + 32);
            ctx.lineTo(ex - 28, ey - 8);
            ctx.fill();
            
            // Eyes
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#111111';
            ctx.beginPath();
            ctx.arc(ex - 10, ey - 12, 7, 0, Math.PI * 2);
            ctx.arc(ex + 10, ey - 12, 7, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ex - 10, ey - 12, 3, 0, Math.PI * 2);
            ctx.arc(ex + 10, ey - 12, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Gun pointing at player (red laser line)
            ctx.strokeStyle = '#ff0044';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0044';
            ctx.beginPath();
            ctx.moveTo(ex, ey - 5);
            ctx.lineTo(playerX, playerY - 30);
            ctx.stroke();
            
            // Timer circle around enemy (shrinks in 1 second)
            const progress = enemy.timeLeft / 4000;
            ctx.shadowBlur = 0;
            ctx.strokeStyle = progress > 0.5 ? '#ffff00' : '#ff0000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(ex, ey - 8, 42, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
            ctx.stroke();
        }
        
        // Draw neon background grid
        function drawBackground() {
            ctx.fillStyle = '#0a001f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Neon grid
            ctx.strokeStyle = '#220044';
            ctx.lineWidth = 2;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Subtle center neon circle
            ctx.shadowBlur = 60;
            ctx.shadowColor = '#ff00ff';
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.15)';
            ctx.lineWidth = 80;
            ctx.beginPath();
            ctx.arc(playerX, playerY, 160, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        
                function spawnEnemy() {
            if (currentEnemy) return;
            
            const directions = [
                {dir: 'up', x: playerX, y: 70},
                {dir: 'down', x: playerX, y: 530},
                {dir: 'left', x: 70, y: playerY},
                {dir: 'right', x: 730, y: playerY}
            ];
            
            const chosen = directions[Math.floor(Math.random() * 4)];
            
            // Dynamic wait time: starts at 4000ms, decreases with score
            let waitTime = Math.max(700, baseWaitTime - (score * 65)); 
            // Minimum 0.7 seconds so it doesn't become impossible too fast
            
            currentEnemy = {
                dir: chosen.dir,
                x: chosen.x,
                y: chosen.y,
                timeLeft: waitTime,
                alive: true
            };
        }
        
                function shoot() {
            if (gameState !== 'playing' || !currentEnemy || !currentAim) return;
            
            if (currentAim === currentEnemy.dir && currentEnemy.timeLeft > 0) {
                // SUCCESS - Kill enemy
                currentEnemy.alive = false;
                playGunshot(true);
                playEnemyShout();
                score++;
                document.getElementById('score-value').textContent = String(score).padStart(3, '0');
                
                setTimeout(() => {
                    currentEnemy = null;
                    setTimeout(() => {
                        if (gameState === 'playing') spawnEnemy();
                    }, 420);
                }, 120);
            }
            // If wrong direction → nothing happens (enemy will shoot you)
        }
        
        function gameOver() {
            if (gameState !== 'playing') return;
            gameState = 'over';
            playPlayerDeath();
            
            // Show enemy shot sound
            playGunshot(false);
            
            const slogan = deathSlogans[Math.floor(Math.random() * deathSlogans.length)];
            document.getElementById('death-slogan').textContent = slogan;
            document.getElementById('final-score').textContent = String(score).padStart(3, '0');
            document.getElementById('game-over-screen').style.display = 'flex';
            
            currentEnemy = null;
        }
        
        function update(delta) {
            if (gameState !== 'playing') return;
            
            if (currentEnemy && currentEnemy.alive) {
                currentEnemy.timeLeft -= delta;
                
                if (currentEnemy.timeLeft <= 0) {
                    gameOver();
                }
            }
        }
        
        function draw() {
            drawBackground();
            drawPlayer();
            
            if (currentAim) drawAimIndicator();
            
            if (currentEnemy && currentEnemy.alive) {
                drawEnemy(currentEnemy);
            }
            
            // Instructions when no enemy
            if (!currentEnemy && gameState === 'playing') {
                ctx.fillStyle = 'rgba(255,255,0,0.6)';
                ctx.font = '18px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.fillText('NEXT ENEMY INCOMING...', playerX, 40);
            }
        }
        
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;
            
            update(delta);
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Keyboard controls
                function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if (gameState !== 'playing') return;
                
                let direction = null;
                
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        direction = 'up';
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        direction = 'down';
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        direction = 'left';
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        direction = 'right';
                        break;
                }
                
                if (direction) {
                    currentAim = direction;
                    shoot();           // ← Auto fire when arrow is pressed
                }
            });
        }
        
        // Touch / Mobile controls
                function setupMobileControls() {
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            
            function handleDirection(dir) {
                if (gameState === 'playing') {
                    currentAim = dir;
                    shoot();           // ← Auto fire on touch
                }
            }
            
            btnUp.addEventListener('touchstart', e => { e.preventDefault(); handleDirection('up'); });
            btnDown.addEventListener('touchstart', e => { e.preventDefault(); handleDirection('down'); });
            btnLeft.addEventListener('touchstart', e => { e.preventDefault(); handleDirection('left'); });
            btnRight.addEventListener('touchstart', e => { e.preventDefault(); handleDirection('right'); });
            
            // Also support mouse click for testing
            btnUp.addEventListener('mousedown', () => handleDirection('up'));
            btnDown.addEventListener('mousedown', () => handleDirection('down'));
            btnLeft.addEventListener('mousedown', () => handleDirection('left'));
            btnRight.addEventListener('mousedown', () => handleDirection('right'));
        }
        
        // Start the game
        window.startGame = function() {
            document.getElementById('start-screen').style.display = 'none';
            gameState = 'playing';
            score = 0;
            document.getElementById('score-value').textContent = '000';
            currentAim = null;
            currentEnemy = null;
            initAudio(); // user gesture required for audio
            spawnEnemy();
        };
        
        // Restart
        window.restartGame = function() {
            document.getElementById('game-over-screen').style.display = 'none';
            gameState = 'playing';
            score = 0;
            document.getElementById('score-value').textContent = '000';
            currentAim = null;
            currentEnemy = null;
            spawnEnemy();
        };
        
        // Initialize everything
        function init() {
            setupKeyboard();
            setupMobileControls();
            
            // Show start screen
            document.getElementById('start-screen').style.display = 'flex';
            
            // Start the render loop
            requestAnimationFrame(gameLoop);
            
            console.log('%c🎮 Neon-fu loaded successfully!', 'color:#ff00ff; font-size:18px; font-family:monospace');
        }
        
        // Boot the game
        window.onload = init;
    </script>
</body>
</html>
