<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon-fu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a001f;
            color: #00ffff;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a0033 0%, #0a001f 70%);
        }
        
        canvas {
            border: 4px solid #ff00ff;
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 15px #ffff00;
            z-index: 20;
        }
        
        #mobile-controls {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 40;
            user-select: none;
        }
        
        .dir-btn {
            width: 85px;
            height: 85px;
            font-size: 48px;
            background: rgba(0, 255, 255, 0.3);
            border: 5px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 25px #00ffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px #00ffff;
            touch-action: manipulation;
        }
        
        #game-over-screen, #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 0, 31, 0.95);
            border: 6px solid #ff00ff;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 0 0 40px #ff00ff, 0 0 80px #00ffff;
            pointer-events: auto;
            display: none;
            flex-direction: column;
            align-items: center;
            min-width: 380px;
            z-index: 50;
        }
        
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 22px;
            background: #000;
            color: #ffff00;
            border: 4px solid #ffff00;
            cursor: pointer;
            box-shadow: 0 0 20px #ffff00;
        }
        
        button:hover {
            background: #ffff00;
            color: #000;
        }
        
        .slogan {
            font-size: 28px;
            color: #ff00ff;
            margin: 15px 0;
            text-shadow: 0 0 20px #ff00ff;
        }
        
        @media (max-width: 768px) {
            .dir-btn { width: 90px; height: 90px; font-size: 50px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        
        <div id="score">SCORE: <span id="score-value">000</span></div>
        
        <!-- Mobile Arrows -->
        <div id="mobile-controls">
            <div id="arrows" style="position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: center;">
                <button class="dir-btn" id="btn-up" style="margin-bottom: 8px;">↑</button>
                <div style="display: flex; gap: 8px;">
                    <button class="dir-btn" id="btn-left">←</button>
                    <button class="dir-btn" id="btn-down">↓</button>
                    <button class="dir-btn" id="btn-right">→</button>
                </div>
            </div>
        </div>
        
        <div id="ui-overlay">
            <div id="start-screen">
                <h1 id="title">NEON-FU</h1>
                <p style="color:#ffff00; margin:10px 0 30px; font-size:18px;">4 DIRECTIONS • PURE REFLEX</p>
                <button onclick="startGame()">START GAME</button>
            </div>
            
            <div id="game-over-screen">
                <h1 style="color:#ff0000;">GAME OVER</h1>
                <div id="death-slogan" class="slogan"></div>
                <div style="font-size:22px; margin:15px 0; color:#ffff00;">
                    FINAL SCORE: <span id="final-score" style="color:#00ffff"></span>
                </div>
                <button onclick="restartGame()">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let audioCtx;
        let gameState = 'start';
        let score = 0;
        let baseWaitTime = 4000;
        let currentAim = null;
        let currentEnemy = null;
        let lastTime = 0;
        let playerX = 400;
        let playerY = 300;
        
        const deathSlogans = [
            "SPECTACLES SHATTERED!", "HAT'S OFF... FOREVER!", "NEON DOWN, BABY!",
            "GHOSTED BY A GHOST!", "LIGHTS OUT, FIGHTER!", "YOU GOT NEON'D!"
        ];
        
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playGunshot(isPlayer) {
            initAudio();
            // Simple gunshot sound (same as before)
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(isPlayer ? 180 : 140, audioCtx.currentTime);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
        
        function playEnemyShout() {
            initAudio();
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(720, audioCtx.currentTime);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
        }
        
        function playPlayerDeath() {
            initAudio();
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
        }
        
        // Draw functions (kept same as working version)
        function drawPlayer() { /* ... same as your code ... */ 
            ctx.shadowBlur = 25; ctx.shadowColor = '#00ffff';
            ctx.fillStyle = '#00ffff'; ctx.fillRect(playerX-28, playerY-8, 56, 58);
            ctx.fillStyle = '#ffddaa'; ctx.beginPath(); ctx.arc(playerX, playerY-38, 26, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#0044ff'; ctx.fillRect(playerX-32, playerY-68, 64, 14);
            ctx.beginPath(); ctx.moveTo(playerX-22, playerY-68); ctx.lineTo(playerX, playerY-88); ctx.lineTo(playerX+22, playerY-68); ctx.fill();
            ctx.strokeStyle = '#111'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.ellipse(playerX-11, playerY-38, 11, 9, 0, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(playerX+11, playerY-38, 11, 9, 0, 0, Math.PI*2); ctx.stroke();
        }
        
        function drawAimIndicator() {
            ctx.shadowBlur = 30;
            const dirs = { up: {x:playerX,y:playerY-95,text:'↑'}, down:{x:playerX,y:playerY+95,text:'↓'},
                           left:{x:playerX-95,y:playerY,text:'←'}, right:{x:playerX+95,y:playerY,text:'→'}};
            Object.keys(dirs).forEach(key => {
                const pos = dirs[key];
                const active = currentAim === key;
                ctx.shadowColor = active ? '#ffff00' : '#00ffff';
                ctx.fillStyle = active ? '#ffff00' : '#00ffff';
                ctx.font = active ? 'bold 48px Arial' : 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(pos.text, pos.x, pos.y);
            });
            ctx.shadowBlur = 0;
        }
        
        function drawEnemy(enemy) {
            const ex = enemy.x, ey = enemy.y;
            ctx.shadowBlur = 40; ctx.shadowColor = '#00ff88';
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.arc(ex, ey-8, 28, Math.PI, 0, false);
            ctx.lineTo(ex+28, ey+32);
            ctx.quadraticCurveTo(ex+18,ey+48,ex+8,ey+32);
            ctx.quadraticCurveTo(ex-8,ey+48,ex-18,ey+32);
            ctx.quadraticCurveTo(ex-28,ey+48,ex-28,ey+32);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(ex-10,ey-12,7,0,Math.PI*2); ctx.arc(ex+10,ey-12,7,0,Math.PI*2); ctx.fill();
        }
        
        function drawBackground() {
            ctx.fillStyle = '#0a001f'; ctx.fillRect(0,0,canvas.width,canvas.height);
        }
        
        function spawnEnemy() {
            if (currentEnemy) return;
            const dirs = [{dir:'up',x:playerX,y:70},{dir:'down',x:playerX,y:530},
                         {dir:'left',x:70,y:playerY},{dir:'right',x:730,y:playerY}];
            const chosen = dirs[Math.floor(Math.random()*4)];
            
            let waitTime = Math.max(700, baseWaitTime - (score * 70));
            
            currentEnemy = {dir: chosen.dir, x: chosen.x, y: chosen.y, timeLeft: waitTime, alive: true};
        }
        
        function shoot() {
            if (gameState !== 'playing' || !currentEnemy || !currentAim) return;
            if (currentAim === currentEnemy.dir && currentEnemy.timeLeft > 0) {
                currentEnemy.alive = false;
                playGunshot(true);
                playEnemyShout();
                score++;
                document.getElementById('score-value').textContent = String(score).padStart(3, '0');
                
                setTimeout(() => {
                    currentEnemy = null;
                    if (gameState === 'playing') setTimeout(spawnEnemy, 400);
                }, 150);
            }
        }
        
        function gameOver() {
            gameState = 'over';
            playPlayerDeath();
            playGunshot(false);
            const slogan = deathSlogans[Math.floor(Math.random()*deathSlogans.length)];
            document.getElementById('death-slogan').textContent = slogan;
            document.getElementById('final-score').textContent = String(score).padStart(3, '0');
            document.getElementById('game-over-screen').style.display = 'flex';
        }
        
        function update(delta) {
            if (gameState !== 'playing' || !currentEnemy) return;
            currentEnemy.timeLeft -= delta;
            if (currentEnemy.timeLeft <= 0) gameOver();
        }
        
        function draw() {
            drawBackground();
            drawPlayer();
            if (currentAim) drawAimIndicator();
            if (currentEnemy && currentEnemy.alive) drawEnemy(currentEnemy);
        }
        
        function gameLoop(ts) {
            if (!lastTime) lastTime = ts;
            const delta = ts - lastTime;
            lastTime = ts;
            update(delta);
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if (gameState !== 'playing') return;
                let dir = null;
                if (['ArrowUp','w','W'].includes(e.key)) dir = 'up';
                if (['ArrowDown','s','S'].includes(e.key)) dir = 'down';
                if (['ArrowLeft','a','A'].includes(e.key)) dir = 'left';
                if (['ArrowRight','d','D'].includes(e.key)) dir = 'right';
                
                if (dir) {
                    currentAim = dir;
                    shoot();
                }
            });
        }
        
        function setupMobileControls() {
            ['up','down','left','right'].forEach(dir => {
                const btn = document.getElementById('btn-' + dir);
                if (btn) {
                    btn.addEventListener('touchstart', e => {
                        e.preventDefault();
                        currentAim = dir;
                        shoot();
                    });
                    btn.addEventListener('mousedown', () => {
                        currentAim = dir;
                        shoot();
                    });
                }
            });
        }
        
        window.startGame = function() {
            document.getElementById('start-screen').style.display = 'none';
            gameState = 'playing';
            score = 0;
            document.getElementById('score-value').textContent = '000';
            currentAim = null;
            currentEnemy = null;
            initAudio();
            spawnEnemy();
        };
        
        window.restartGame = function() {
            document.getElementById('game-over-screen').style.display = 'none';
            gameState = 'playing';
            score = 0;
            document.getElementById('score-value').textContent = '000';
            currentAim = null;
            currentEnemy = null;
            spawnEnemy();
        };
        
        function init() {
            setupKeyboard();
            setupMobileControls();
            document.getElementById('start-screen').style.display = 'flex';
            requestAnimationFrame(gameLoop);
        }
        
        window.onload = init;
    </script>
</body>
</html>
